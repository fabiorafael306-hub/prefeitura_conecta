# Configuração exclusiva dos testes: H2 em memória (modo PostgreSQL). Não usa o banco real nem o .env.
spring.datasource.url=jdbc:h2:mem:prefeitura;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
app.jwt.secret=segredo-somente-para-testes-automatizados-0123456789
app.jwt.expiracao-minutos=60
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
