spring.application.name=prefeitura-conecta
server.port=${SERVER_PORT:8080}

# Lê variáveis de um arquivo .env local (opcional, NÃO versionado — veja .env.example).
# Variáveis de ambiente do sistema também funcionam e têm precedência.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# --- PostgreSQL ---
# Sem valor padrão para a senha: defina DB_PASSWORD no .env ou no ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/prefeitura_conecta}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# --- Autenticação (JWT HS256) ---
# Obrigatório: string aleatória com pelo menos 32 caracteres. Ex.: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:60}

# --- CORS ---
# Origens do frontend autorizadas, separadas por vírgula.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
